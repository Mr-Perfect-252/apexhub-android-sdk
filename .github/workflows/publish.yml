name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Publish SDK
        run: ./gradlew :sdk:publishReleasePublicationToGitHubPackagesRepository --no-daemon --no-build-cache --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apexhub-sdk-aar
          path: sdk/build/outputs/aar/sdk-release.aar

      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sdk/build/outputs/aar/sdk-release.aar
          body: |
            ## ApexHub Android SDK ${{ github.ref_name }}

            ```kotlin
            // settings.gradle.kts — add repository
            maven {
                url = uri("https://maven.pkg.github.com/Mr-Perfect-252/apexhub-android-sdk")
                credentials {
                    username = providers.gradleProperty("gpr.user").get()
                    password = providers.gradleProperty("gpr.key").get()
                }
            }

            // build.gradle.kts
            implementation("com.apexhub:sdk:${{ github.ref_name }}")
            ```
