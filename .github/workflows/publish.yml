name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Publish SDK
        run: ./gradlew :sdk:publishReleasePublicationToGitHubPackagesRepository --no-daemon --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: apexhub-sdk-aar
          path: sdk/build/outputs/aar/sdk-release.aar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sdk/build/outputs/aar/sdk-release.aar
          generate_release_notes: false
          body: |
            ## ApexHub Android SDK ${{ github.ref_name }}

            ### Installation

            Add to your `settings.gradle.kts`:
            ```kotlin
            maven {
                url = uri("https://maven.pkg.github.com/Mr-Perfect-252/apexhub-android-sdk")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
            ```

            Add to your `build.gradle.kts`:
            ```kotlin
            implementation("com.apexhub:sdk:${{ github.ref_name }}")
            ```
