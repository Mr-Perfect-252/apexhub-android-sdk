# Project-wide Gradle settings.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required: the SDK depends on androidx.core, androidx.appcompat
# and androidx.work. Without this the release build fails to resolve the
# AndroidX classpath ("android.useAndroidX property is not enabled").
android.useAndroidX=true

# We do not depend on any legacy com.android.support libraries, so Jetifier
# is not needed.
android.enableJetifier=false

# Kotlin code style.
kotlin.code.style=official

# Only build the resources needed for the configured variant.
android.nonTransitiveRClass=true
